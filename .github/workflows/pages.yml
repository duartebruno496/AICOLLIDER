name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package portable version
        run: |
          cd dist
          zip -r ../aicollider-portable.zip .
          cd ..
          ls -lh aicollider-portable.zip
      - name: Publish portable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create portable aicollider-portable.zip --clobber \
            --title "AICOLLIDER Portable" \
            --notes "Versão portátil (base ./) — abra index.html direto do disco ou sirva estático. Descompacte e use Google Chrome/Edge." \
            --target main 2>/dev/null || true
          gh release upload portable aicollider-portable.zip --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4